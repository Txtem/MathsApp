id: aufg_00005
version: 2
topic: kombinatorik.variation
difficulty: 2
target_time_seconds: 90

compute_ref: kombinatorik.variation.ohne_wdh
answer_type: integer

param_spec:
  n:
    type: int
    min: 6
    max: 12
  k:
    type: int
    min: 2
    max: 4

constraints:
  - "k <= n"

question_text: |
  Bei einem Wettlauf mit {{n}} Teilnehmerinnen werden die ersten {{k}} Plätze
  vergeben. Wie viele verschiedene Anordnungen sind für das Treppchen möglich?

solution_text: |
  Variation ohne Wiederholung, die Reihenfolge bzw. Anordnung zählt:
  $$\frac{ {{n}}! }{ ({{n}}-{{k}})! } = {{result}}$$

hints:
  - "Kommt es auf die Reihenfolge an? Und darf ein Element mehrfach vorkommen?"
  - "Es werden nur {{k}} Plätze vergeben, und jeder Platz geht an eine andere der {{n}} Teilnehmerinnen."
  - "Für Platz 1 gibt es {{n}} Möglichkeiten, für Platz 2 noch {{n}} − 1, … – und nach Platz {{k}} hörst du auf."

tags: [variation, ohne_wiederholung, geordnet]
