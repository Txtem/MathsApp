id: aufg_00005
version: 2
topic: kombinatorik.variation
difficulty: 2
target_time_seconds: 90

compute_ref: kombinatorik.variation.ohne_wdh
answer_type: integer

param_spec:
  n:
    type: int
    min: 6
    max: 12
  k:
    type: int
    min: 2
    max: 4

constraints:
  - "k <= n"

question_text: |
  Bei einem Wettlauf mit {{n}} Teilnehmerinnen werden die ersten {{k}} Plätze
  vergeben. Wie viele verschiedene Anordnungen sind für das Treppchen möglich?

solution_text: |
  Variation ohne Wiederholung, die Reihenfolge bzw. Anordnung zählt:
  $$\frac{ {{n}}! }{ ({{n}}-{{k}})! } = {{result}}$$

hints:
  - "Kommt es auf die Reihenfolge an? Darf jemand mehrfach vorkommen? Bekommen alle einen Platz oder nur eine Auswahl?"
  - "Die Reihenfolge zählt, niemand steht zweimal auf dem Treppchen, aber nur {{k}} der {{n}} bekommen einen Platz. Zähle Platz für Platz, wie viele noch infrage kommen, und überlege, wann du aufhörst."

tags: [variation, ohne_wiederholung, geordnet]
