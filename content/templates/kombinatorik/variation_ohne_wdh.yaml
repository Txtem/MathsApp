id: aufg_00005
version: 1
topic: kombinatorik.variation
difficulty: 2
target_time_seconds: 90

compute_ref: kombinatorik.variation.ohne_wdh
answer_type: integer

param_spec:
  n:
    type: int
    min: 6
    max: 12
  k:
    type: int
    min: 2
    max: 4

constraints:
  - "k <= n"

question_text: |
  Bei einem Wettlauf mit {{n}} Teilnehmerinnen werden die ersten {{k}} Plätze
  vergeben. Wie viele verschiedene Reihenfolgen sind für das Treppchen möglich?

solution_text: |
  Variation ohne Wiederholung, die Reihenfolge zählt:
  $$\frac{ {{n}}! }{ ({{n}}-{{k}})! } = {{result}}$$

tags: [variation, ohne_wiederholung, geordnet]
