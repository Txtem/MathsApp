question_text: |
  Eine Eisdiele bietet {{n}} Sorten an. Du bestellst {{k}} Kugeln und darfst
  Sorten mehrfach wählen. Auf die Reihenfolge kommt es nicht an.
  Wie viele verschiedene Bestellungen gibt es?

solution_text: |
  Kombination mit Wiederholung:
  $$\binom{ {{n}}+{{k}}-1 }{ {{k}} } = {{result}}$$

