id: aufg_00011
version: 1
topic: wahrscheinlichkeit.hypergeometrisch
difficulty: 4
target_time_seconds: 180

compute_ref: wahrscheinlichkeit.hypergeometrisch.genau
answer_type: numeric
round_to: 4

param_spec:
  population:
    type: int
    min: 10
    max: 20
  successes:
    type: int
    min: 3
    max: 6
  draws:
    type: int
    min: 3
    max: 5
  hits:
    type: int
    min: 1
    max: 3

# Die Beziehungen halten die Aufgabe möglich; das Zod-Schema der
# Compute-Funktion prüft sie ein zweites Mal.
constraints:
  - "successes <= population"
  - "draws <= population"
  - "hits <= successes"
  - "hits <= draws"
  - "draws - hits <= population - successes"

question_text: |
  In einer Urne liegen {{population}} Kugeln, davon sind {{successes}} rot.
  Es werden {{draws}} Kugeln ohne Zurücklegen gezogen.
  Wie groß ist die Wahrscheinlichkeit, genau {{hits}} rote Kugeln zu ziehen?
  Gib das Ergebnis als Dezimalzahl auf 4 Nachkommastellen gerundet an.

solution_text: |
  Hypergeometrische Verteilung:
  $$P(X = {{hits}}) = \frac{\binom{ {{successes}} }{ {{hits}} } \cdot \binom{ {{population}}-{{successes}} }{ {{draws}}-{{hits}} }}{\binom{ {{population}} }{ {{draws}} }} = {{result}}$$

tags: [hypergeometrisch, ohne_zuruecklegen]
